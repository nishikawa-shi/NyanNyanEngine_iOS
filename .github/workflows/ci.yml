# NyanNyanEngine CI
#
# beta / store ジョブを workflow_dispatch からも実行できるようにしているのは、
# masterへマージする前に配布経路そのものを実証するため。リポジトリはpublicで
# macOSランナーの無料枠制限がないため、実行回数を気にする必要がない。
#
# store ジョブを push で自動実行しないのは、App Storeから削除された状態では
# TestFlightが利用できないとAppleが案内しており、成功を保証できないため
# （2026-08-22時点）。TestFlightへのアップロードが一度成功したら push へ開放する。
#
# push トリガに作業ブランチを含めないのは、ブランチへのpushとそのPullRequestで
# 同じ qa が二重に走るため。PullRequestを作る前にブランチ単体で検証したい場合は、
# workflow_dispatch から起動する。
#
# pull_request にだけ paths-ignore を置き push には置かないのは、npmの更新を
# 検証できる場所が master へ入った後しかないため。npmはFirebase CLIの固定に
# だけ使っておりiOSのビルドとは無関係だが、Dependabot が起こすPullRequestには
# GitHubがリポジトリのSecretsを渡さない仕様のため、CONFIGS_TAR_B64 が空になり
# GoogleService-Info.plist の不在でiOSビルドが必ず落ちる。PullRequestの時点では
# 秘密情報を使う検証が原理的にできないので走らせず、masterへ入ってから配布
# ジョブで実際に配布できるかを確かめる。npmファイル自体の健全性は npm.yml が見る。
name: CI

on:
  push:
    branches:
      - master
  pull_request:
    paths-ignore:
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      run_beta:
        description: 'β版アプリ配布ステージを実行する'
        type: boolean
        default: false
      run_store:
        description: 'ストアアプリ配布ステージ（TestFlightアップロード）を実行する'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  qa:
    name: 動作検証ステージ
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Inflate configs
        env:
          CONFIGS_TAR_B64: ${{ secrets.CONFIGS_TAR_B64 }}
        run: printf '%s' "$CONFIGS_TAR_B64" | base64 -d | tar -zxv --strip-components=1

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Resolve available iOS Simulator
        run: |
          xcrun simctl list devices
          SIM_NAME=$(xcrun simctl list devices available | grep -E '^[[:space:]]+iPhone' | head -1 | sed -E 's/^[[:space:]]+//; s/[[:space:]]*\(.*//')
          echo "Resolved simulator: $SIM_NAME"
          echo "SIM_DEVICE_NAME=$SIM_NAME" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: |
          xcodebuild \
            -project NyanNyanEngine.xcodeproj \
            -scheme NyanNyanEngineTests \
            -destination "platform=iOS Simulator,name=$SIM_DEVICE_NAME" \
            -testLanguage en -testRegion US \
            -skip-testing:NyanNyanEngineUITests \
            -skipPackagePluginValidation \
            test

  beta:
    name: β版アプリ配布ステージ / Firebaseへベータ版アプリ配布
    needs: qa
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_beta)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Inflate configs
        env:
          CONFIGS_TAR_B64: ${{ secrets.CONFIGS_TAR_B64 }}
        run: printf '%s' "$CONFIGS_TAR_B64" | base64 -d | tar -zxv --strip-components=1

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Setup SSH for match repo
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.MATCH_REPO_DEPLOY_KEY }}

      - name: Fastlane match
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane load_certs

      - name: Resolve build number
        run: echo "IOS_BUILD_NUMBER=$(date -u +%Y%m%d).${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build beta ipa (dev)
        run: bundle exec fastlane build_beta_dev build_number:"$IOS_BUILD_NUMBER"

      - name: Build beta ipa (prd)
        run: bundle exec fastlane build_beta build_number:"$IOS_BUILD_NUMBER"

      - name: Install Firebase tools
        run: |
          npm ci
          npx firebase --version

      - name: Deploy to Firebase App Distribution
        env:
          FIREBASE_APP_ID_IOS_DEV: ${{ secrets.FIREBASE_APP_ID_IOS_DEV }}
          FIREBASE_APP_ID_IOS_PRD: ${{ secrets.FIREBASE_APP_ID_IOS_PRD }}
          FIREBASE_BETA_TESTER_GROUP_NAME_DEV: ${{ secrets.FIREBASE_BETA_TESTER_GROUP_NAME_DEV }}
          FIREBASE_BETA_TESTER_GROUP_NAME_PRD: ${{ secrets.FIREBASE_BETA_TESTER_GROUP_NAME_PRD }}
        run: |
          ls -latr build/
          GOOGLE_APPLICATION_CREDENTIALS=app_distribution_sa_nyannyanengine-ios-d.json npx firebase appdistribution:distribute build/NyanNyanEngine-adhoc-dev.ipa --app "$FIREBASE_APP_ID_IOS_DEV" --groups "$FIREBASE_BETA_TESTER_GROUP_NAME_DEV"
          GOOGLE_APPLICATION_CREDENTIALS=app_distribution_sa_nyannyanengine.json npx firebase appdistribution:distribute build/NyanNyanEngine-adhoc.ipa --app "$FIREBASE_APP_ID_IOS_PRD" --groups "$FIREBASE_BETA_TESTER_GROUP_NAME_PRD"

  store:
    name: ストアアプリ配布ステージ / TestFlightへアップロード
    needs: qa
    if: github.event_name == 'workflow_dispatch' && inputs.run_store
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Inflate configs
        env:
          CONFIGS_TAR_B64: ${{ secrets.CONFIGS_TAR_B64 }}
        run: printf '%s' "$CONFIGS_TAR_B64" | base64 -d | tar -zxv --strip-components=1

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Setup SSH for match repo
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.MATCH_REPO_DEPLOY_KEY }}

      - name: Fastlane match
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane load_certs

      - name: Resolve build number
        run: echo "IOS_BUILD_NUMBER=$(date -u +%Y%m%d).${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        run: bundle exec fastlane upload_ipa_to_testflight build_number:"$IOS_BUILD_NUMBER"
